name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend
        run: |
          cd client
          npm install
          npm run build

      - name: Create Deployment Artifact
        run: |
          mkdir -p deploy_artifact
          cp -r server deploy_artifact/
          mkdir -p deploy_artifact/client
          cp -r client/dist deploy_artifact/client/
          tar -czf deployment.tar.gz -C deploy_artifact .

      - name: Copy Artifact to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "deployment.tar.gz"
          target: "/home/ubuntu/"

      - name: Extract and Run on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            
            # Extract artifact over existing folder to preserve .env
            mkdir -p ~/nexa-fullstack-platform
            tar -xzf ~/deployment.tar.gz -C ~/nexa-fullstack-platform
            
            # Setup Server
            cd ~/nexa-fullstack-platform/server
            npm install --production
            pm2 restart nexa-server || pm2 start server.js --name nexa-server
            
            # Setup Client
            sudo cp -r ~/nexa-fullstack-platform/client/dist/* /var/www/html/
            
            # Cleanup artifact
            rm ~/deployment.tar.gz
